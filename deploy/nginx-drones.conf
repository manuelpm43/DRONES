# Sitio nginx del visor DRONES: /etc/nginx/sites-available/drones
# (enlazado en sites-enabled). Certbot añade el bloque HTTPS y la redirección
# desde HTTP al ejecutar: certbot --nginx -d drones.geospatiallab.xyz
server {
    listen 80;
    listen [::]:80;
    server_name drones.geospatiallab.xyz;

    # Acceso restringido: usuarios en /etc/nginx/drones.htpasswd.
    auth_basic "Visor DRONES";
    auth_basic_user_file /etc/nginx/drones.htpasswd;

    # Hojas del CNIG: hasta ~1 GB por recorte (MDT02_MAX_UPLOAD_BYTES en .env).
    client_max_body_size 1100m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
